<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Asteroid Watcher</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="comet.png">
</head>

<body class="bg-slate-950 text-white">
    <div class="flex justify-between max-w-5xl mx-auto mt-10 items-center">
        <h1 class="text-3xl">Asteroid Watcher</h1>
        <div class="flex flex-col">
            <input id="date" type="date" class="m-6 rounded bg-slate-800 p-2 text-white">
            <p id="input-error" class="text-slate-400 text-md max-w-80 text-wrap"></p>
        </div>
    </div>
    <div id="card" class="max-w-md mx-auto bg-slate-900 rounded-2xl p-6 space-y-3">
        <h2 id="name" class="text-2xl font-bold"></h2>
        <div class="relative mx-auto my-6 h-80 w-80">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 h-7 w-7 rounded-full bg-blue-500">
            </div>

            <div class="orbit moon-orbit">
                <div id="moon" class="body h-4 w-4 bg-gray-300"></div>
            </div>

            <div class="orbit asteroid-orbit">
                <div id="dot" class="body h-3 w-3 bg-orange-400"></div>
            </div>
        </div>
        <span id="badge" class="inline-block px-3 py-1 rounded-full text-sm"></span>
        <p>Size: <span id="size"></span> m wide</p>
        <p>Speed: <span id="speed"></span> km/s</p>
        <p>Passes at <span id="miss"></span> Moon distances</p>
        <p id="count">(-/-)</p>
    </div>
    <div class="flex justify-between mx-auto max-w-md">
        <button id="prev" class="hover:bg-gray-400 px-4 py-2 rounded-full transition-all delay-50">Previous</button>
        <button id="next" class="hover:bg-gray-400 px-4 py-2 rounded-full transition-all delay-50">Next</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
